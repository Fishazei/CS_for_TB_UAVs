version: 1

profiles:
  quad_4motors_basic:
    description: "Классический X-квадрокоптер с 4 моторами"

    base_power:
      hover: 0.6        # базовый уровень для висения

    maneuvers:
      climb_rate:
        # все моторы увеличивают мощность одинаково
        formula: "all += k * rate"
        k: 0.3

      attitude_pitch:
        # pitch > 0: вперёд (передние меньше, задние больше)
        roles:
          front_left:  { gain: -0.2 }
          front_right: { gain: -0.2 }
          rear_left:   { gain:  0.2 }
          rear_right:  { gain:  0.2 }

      attitude_roll:
        # roll > 0: вправо (левые меньше, правые больше)
        roles:
          front_left:  { gain: -0.2 }
          rear_left:   { gain: -0.2 }
          front_right: { gain:  0.2 }
          rear_right:  { gain:  0.2 }

      yaw:
        # yaw: противоположные диагонали меняют мощность разные знаки
        roles:
          front_left:  { gain:  0.15 }
          rear_right:  { gain:  0.15 }
          front_right: { gain: -0.15 }
          rear_left:   { gain: -0.15 }