version: 1

stand:
  name: "quad_4motors_v1"
  description: "Стенд с четырьмя моторами, имитация классического квадрокоптера"
  update_rate_hz: 50          # частота обновления команд (сценариев)

motors:
  - id: 1
    name: "front_left"
    role: "front_left"
    type: "bldc_2205"
    sound_profile: "aggressive_5inch"
    max_power: 1.0            # нормированная мощность [0..1]
  - id: 2
    name: "front_right"
    role: "front_right"
    type: "bldc_2205"
    sound_profile: "aggressive_5inch"
    max_power: 1.0
  - id: 3
    name: "rear_left"
    role: "rear_left"
    type: "bldc_2205"
    sound_profile: "aggressive_5inch"
    max_power: 1.0
  - id: 4
    name: "rear_right"
    role: "rear_right"
    type: "bldc_2205"
    sound_profile: "aggressive_5inch"
    max_power: 1.0

controllers:
  - id: "A1"
    kind: "arduino_uno"
    port: "COM5"              # или /dev/ttyXXX под Linux
    baudrate: 9600
    protocol: "simple_text"   # твой протокол "<channel> <value>\n"
    motors:
      - motor_id: 1
        channel: 1            # motorNumber в твоём скетче
      - motor_id: 2
        channel: 2
      - motor_id: 3
        channel: 3
      - motor_id: 4
        channel: 4

# Общие параметры ESC/сигналов (по желанию)
esc:
  signal_type: "servo_deg"    # как сейчас: 0/90/180 градусов
  min_value: 0
  mid_value: 90
  max_value: 180
  arming_sequence:
    enabled: true
    steps:
      - value: 0
        duration_ms: 1000